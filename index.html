<style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; }
    
    #bloqueio { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .login-card { background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 320px; width: 90%; }
    .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #cbd5e1; text-align: center; font-size: 16px; box-sizing: border-box; }
    .login-card button { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }

    #main-header { position: fixed; top: 0; left: 0; width: 100%; background: #0f172a; color: white; padding: 14px; text-align: center; z-index: 5000; }

    .control-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.96); padding: 20px; border-radius: 20px 20px 0 0; z-index: 5000; display: flex; flex-direction: column; gap: 15px; }

    .calc-area { display: flex; gap: 10px; }
    .calc-input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; text-align: center; }
    .calc-result { flex: 1; color: #3b82f6; font-weight: bold; text-align: center; font-size: 1.3rem; }

    .tool-selector { display: flex; gap: 10px; }
    .tool-btn { flex: 1; padding: 12px; background: #1e293b; color: #94a3b8; border: 1px solid #475569; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .tool-btn.active { color: white; border-color: #3b82f6; box-shadow: 0 0 10px rgba(59,130,246,0.4); }

    .option-scroller { display: flex; gap: 12px; overflow-x: auto; }
    .swatch { padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 11px; border: 2px solid #475569; }

    .btn-whats { background: #25d366; color: white; text-align: center; padding: 14px; border-radius: 8px; font-weight: bold; text-decoration: none; }
</style>

</head>

<body>

<!-- LOGIN -->

<div id="bloqueio">
    <div class="login-card">
        <i class="fas fa-lock-open" style="font-size: 2rem; color: #3b82f6;"></i>
        <h3>Simulador WebAR</h3>
        <input type="password" id="senhaInput" placeholder="Digite a Senha">
        <button onclick="validar()">ACESSAR</button>
    </div>
</div>

<!-- INTERFACE -->

<div id="app-interface" style="display:none;">
    <header id="main-header">GUIA URBANO</header>

```
<div class="control-panel">
    <div class="calc-area">
        <input type="number" id="largura" class="calc-input" placeholder="L" oninput="calcularM2()">
        <input type="number" id="altura" class="calc-input" placeholder="A" oninput="calcularM2()">
        <div class="calc-result" id="resultadoM2">0 m²</div>
    </div>

    <div class="tool-selector">
        <button class="tool-btn active" onclick="setMode('piso', this)">PISO</button>
        <button class="tool-btn" onclick="setMode('parede', this)">PAREDE</button>
    </div>

    <div class="option-scroller" id="container-opcoes"></div>

    <a href="#" onclick="enviarWhats()" class="btn-whats">WhatsApp</a>
</div>
```

</div>

<!-- AR -->

<a-scene embedded arjs>
    <a-marker preset="hiro">
        <a-plane id="obj-piso" rotation="-90 0 0" width="3" height="3" color="#e3d5ca"></a-plane>
        <a-plane id="obj-parede" position="0 1.5 -1.5" width="3" height="3" color="#cbd5e1" visible="false"></a-plane>
    </a-marker>
    <a-entity camera></a-entity>
</a-scene>

<script>
let corSelecionada = "Nenhuma";
let m2Final = 0;

function validar() {
    const input = document.getElementById('senhaInput').value;
    if(input === "123") {
        document.getElementById('bloqueio').style.display = 'none';
        document.getElementById('app-interface').style.display = 'block';
    } else {
        alert("Senha incorreta");
    }
}

function calcularM2() {
    const l = parseFloat(document.getElementById('largura').value) || 0;
    const a = parseFloat(document.getElementById('altura').value) || 0;
    m2Final = (l * a).toFixed(2);
    document.getElementById('resultadoM2').innerText = m2Final + " m²";
}

const materiais = {
    piso: [
        { name: 'Madeira', color: '#e3d5ca' },
        { name: 'Branco', color: '#ffffff' }
    ],
    parede: [
        { name: 'Azul', color: '#dbeafe' },
        { name: 'Bege', color: '#fef3c7' }
    ]
};

function setMode(mode, btn) {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.getElementById('obj-piso').setAttribute('visible', mode === 'piso');
    document.getElementById('obj-parede').setAttribute('visible', mode !== 'piso');

    renderOptions(mode);
}

function renderOptions(mode) {
    const container = document.getElementById('container-opcoes');
    container.innerHTML = '';

    materiais[mode].forEach(m => {
        const div = document.createElement('div');
        div.className = 'swatch';
        div.style.background = m.color;
        div.innerText = m.name;

        div.onclick = () => {
            corSelecionada = m.name;
            const alvo = mode === 'piso' ? 'obj-piso' : 'obj-parede';
            document.getElementById(alvo).setAttribute('color', m.color);
        };

        container.appendChild(div);
    });
}

function enviarWhats() {
    const numero = "5599999999999";
    const texto = `Área: ${m2Final} m² | Material: ${corSelecionada}`;
    window.open(`https://wa.me/${numero}?text=${encodeURIComponent(texto)}`, '_blank');
}

renderOptions('piso');
</script>

</body>
</html>
